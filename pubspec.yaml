name: parksnap
description: ParkSnap - Automated gate-level vehicle logging using camera capture and Gemini AI.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Camera & Image
  camera: ^0.10.5+9
  image_picker: ^1.1.2
  permission_handler: ^11.3.1

  # State Management
  provider: ^6.1.2

  # Local Database
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # Gemini AI
  google_generative_ai: ^0.4.6

  # Secure Storage (API Key)
  flutter_secure_storage: ^9.2.2

  # Utilities
  uuid: ^4.5.1
  intl: ^0.19.0
  path_provider: ^2.1.4

  # Google Fonts
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
